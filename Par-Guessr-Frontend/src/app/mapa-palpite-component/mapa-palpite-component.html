<div class="caixa" [class.ampliado]="ampliado()" (keydown.escape)="fecharAmpliado()">
  <div
    #mapa
    class="mapa"
    [class.desabilitado]="desabilitado() || resposta()"
    role="application"
    aria-label="Planta do campus. Clique para marcar onde você acha que a foto foi tirada. Com o teclado, use as setas para mover o mapa e Enter para marcar o centro."
    (keydown.enter)="marcarCentro()"
  ></div>
  <button
    type="button"
    class="ampliar"
    [attr.aria-pressed]="ampliado()"
    (click)="alternarAmpliado()"
  >
    {{ ampliado() ? 'Fechar tela cheia' : 'Tela cheia' }}
  </button>
</div>
@if (!desabilitado() && !resposta()) {
  <p class="legenda">
    {{ marcador() ? 'Palpite marcado. Toque de novo para mudar.' : 'Arraste e dê zoom para explorar. Toque para marcar.' }}
  </p>
}
