<main class="login">
  <h1>Par-Guessr</h1>
  <h2>Entrar</h2>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <label for="email">E-mail</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    @if (submitted && loginForm.controls.email.invalid) {
      <small>Informe um e-mail válido.</small>
    }

    <label for="password">Senha</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (submitted && loginForm.controls.password.invalid) {
      <small>Informe sua senha.</small>
    }

    <button type="submit">Entrar</button>
    @if (errorMessage) {
      <small>{{ errorMessage }}</small>
    }
  </form>

  <a routerLink="/cadastro">Ainda não tenho uma conta</a>
</main>
